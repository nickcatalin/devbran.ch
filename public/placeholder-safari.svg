  <rect x="70" y="80" width="460" height="150" rx="12" fill="#565264"/>
  <circle cx="150" cy="155" r="35" fill="#E8C7DE"/>
  <rect x="200" y="130" width="180" height="20" rx="10" fill="#E8C7DE"/>
  <rect x="200" y="160" width="140" height="16" rx="8" fill="#56876D"/>
  <rect x="200" y="185" width="100" height="12" rx="6" fill="#E8C7DE" opacity="0.7"/>
  
  <!-- Profile stats -->
  <rect x="70" y="260" width="460" height="100" rx="12" fill="#f8f9fa"/>
  <rect x="100" y="290" width="120" height="16" rx="8" fill="#565264"/>
  <rect x="100" y="315" width="80" height="12" rx="6" fill="#56876D"/>
  <rect x="100" y="335" width="140" height="10" rx="5" fill="#E8C7DE"/>
  
  <rect x="270" y="290" width="130" height="16" rx="8" fill="#565264"/>
  <rect x="270" y="315" width="90" height="12" rx="6" fill="#56876D"/>
  <rect x="270" y="335" width="160" height="10" rx="5" fill="#E8C7DE"/>
  
  <!-- Bio section -->
  <rect x="70" y="390" width="460" height="80" rx="12" fill="#E8C7DE"/>
  <rect x="100" y="420" width="400" height="14" rx="7" fill="#565264"/>
  <rect x="100" y="445" width="350" height="12" rx="6" fill="#565264" opacity="0.8"/>
  
  <!-- Join waitlist section -->
  <rect x="70" y="500" width="460" height="120" rx="12" fill="#56876D"/>
  <text x="300" y="535" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Join the Waitlist</text>
  <text x="300" y="560" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14">Be among the first to join DevBran.ch</text>
  <rect x="120" y="580" width="360" height="25" rx="12" fill="white" opacity="0.2"/>
  
  <!-- Right column - Links -->
  <rect x="600" y="40" width="560" height="620" rx="16" fill="white"/>
  
