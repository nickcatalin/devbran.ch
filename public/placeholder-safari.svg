  <!-- Link items -->
  <rect x="630" y="160" width="500" height="80" rx="12" fill="#E8C7DE"/>
  <circle cx="680" cy="200" r="20" fill="#565264"/>
  <rect x="720" y="185" width="150" height="16" rx="8" fill="#565264"/>
  <rect x="720" y="210" width="200" height="12" rx="6" fill="#565264" opacity="0.7"/>
  <rect x="1050" y="190" width="60" height="20" rx="10" fill="#56876D"/>
  <text x="1080" y="205" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Visit</text>
  
  <rect x="630" y="260" width="500" height="80" rx="12" fill="#56876D"/>
  <circle cx="680" cy="300" r="20" fill="white"/>
  <rect x="720" y="285" width="170" height="16" rx="8" fill="white"/>
  <rect x="720" y="310" width="220" height="12" rx="6" fill="white" opacity="0.8"/>
  <rect x="1050" y="290" width="60" height="20" rx="10" fill="#E8C7DE"/>
  <text x="1080" y="305" text-anchor="middle" fill="#565264" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Visit</text>
  
  <rect x="630" y="360" width="500" height="80" rx="12" fill="#E8C7DE"/>
  <circle cx="680" cy="400" r="20" fill="#565264"/>
  <rect x="720" y="385" width="140" height="16" rx="8" fill="#565264"/>
  <rect x="720" y="410" width="180" height="12" rx="6" fill="#565264" opacity="0.7"/>
  <rect x="1050" y="390" width="60" height="20" rx="10" fill="#56876D"/>
  <text x="1080" y="405" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Visit</text>
  
  <rect x="630" y="460" width="500" height="80" rx="12" fill="#56876D"/>
  <circle cx="680" cy="500" r="20" fill="white"/>
  <rect x="720" y="485" width="160" height="16" rx="8" fill="white"/>
  <rect x="720" y="510" width="190" height="12" rx="6" fill="white" opacity="0.8"/>
  <rect x="1050" y="490" width="60" height="20" rx="10" fill="#E8C7DE"/>
  <text x="1080" y="505" text-anchor="middle" fill="#565264" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Visit</text>
  
  <!-- Add more links button -->
  <rect x="630" y="560" width="500" height="60" rx="12" fill="#f8f9fa" stroke="#E8C7DE" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="880" y="595" text-anchor="middle" fill="#565264" font-family="Arial, sans-serif" font-size="16">+ Add More Links</text>
  
  <!-- Footer branding -->
  <text x="600" y="670" text-anchor="middle" fill="#565264" font-family="Arial, sans-serif" font-size="24" font-weight="bold">DevBran.ch</text>
  <text x="600" y="690" text-anchor="middle" fill="#56876D" font-family="Arial, sans-serif" font-size="14">Connect your developer identity</text>
</svg>
